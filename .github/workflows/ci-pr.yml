# Pull request gate — block merge on critical unit + smoke UI failures.
name: CI Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  pr-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Check hosted iOS SDK
        id: sdk
        run: |
          if xcodebuild -showsdks | grep -q 'iphonesimulator.*26'; then
            echo "can_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Hosted runner does not include an iOS 26 simulator SDK; skipping Xcode build/test gate. Physical device and local Xcode 26.5 validation remain required for release."
            echo "can_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve simulator destination
        if: steps.sdk.outputs.can_build == 'true'
        id: sim
        run: |
          DEST=$(xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM -showdestinations 2>/dev/null \
            | awk -F'[{},]' '/platform:iOS Simulator/ && /OS:/{print $0}' | head -1)
          if [ -z "$DEST" ]; then
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
          else
            NAME=$(echo "$DEST" | sed -n 's/.*name:\([^,}]*\).*/\1/p' | xargs)
            OS=$(echo "$DEST" | sed -n 's/.*OS:\([^,}]*\).*/\1/p' | xargs)
            echo "destination=platform=iOS Simulator,name=${NAME},OS=${OS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' build

      - name: Validate API integrations
        run: bash scripts/api/validate-integrations.sh

      - name: Validate TestFlight admin scripts
        run: bash scripts/testflight/enforce_ci_check.sh

      - name: Full unit suite (Tiers 1 + 4)
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' \
            -only-testing:WCS-BIMTests \
            -skip-testing:WCS-BIMTests/ModelContainerBootstrapTests \
            test

      - name: UI function registry unit tests
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' \
            -only-testing:WCS-BIMTests/UIFunctionRegistryTests \
            test

      - name: API integration unit tests
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' \
            -only-testing:WCS-BIMTests/APIIntegrationTests \
            test

      - name: Tier 1 UI smoke (critical flows)
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' \
            -parallel-testing-enabled NO \
            -only-testing:WCS-BIMUITests/Tier1SmokeUITests \
            -only-testing:WCS-BIMUITests/DesignSystemUITests \
            -only-testing:WCS-BIMUITests/UIFunctionMatrixUITests/testRegistryCatalogIsComplete \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: '**/Logs/Test/**/*.xcresult'

  integration-optional:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      - name: Check hosted iOS SDK
        id: sdk
        run: |
          if xcodebuild -showsdks | grep -q 'iphonesimulator.*26'; then
            echo "can_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Hosted runner does not include an iOS 26 simulator SDK; skipping optional SwiftData integration test."
            echo "can_build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve simulator destination
        if: steps.sdk.outputs.can_build == 'true'
        id: sim
        run: |
          DEST=$(xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM -showdestinations 2>/dev/null \
            | awk -F'[{},]' '/platform:iOS Simulator/ && /OS:/{print $0}' | head -1)
          if [ -z "$DEST" ]; then
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
          else
            NAME=$(echo "$DEST" | sed -n 's/.*name:\([^,}]*\).*/\1/p' | xargs)
            OS=$(echo "$DEST" | sed -n 's/.*OS:\([^,}]*\).*/\1/p' | xargs)
            echo "destination=platform=iOS Simulator,name=${NAME},OS=${OS}" >> "$GITHUB_OUTPUT"
          fi
      - name: SwiftData integration (informational)
        if: steps.sdk.outputs.can_build == 'true'
        run: |
          xcodebuild -project WCS-BIM.xcodeproj -scheme WCS-BIM \
            -destination '${{ steps.sim.outputs.destination }}' \
            -only-testing:WCS-BIMTests/ModelContainerBootstrapTests \
            test
